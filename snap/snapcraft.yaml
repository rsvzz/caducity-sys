name: caducity-sys
version: '0.1.0'
summary: caducity-sys
description: caducity-sys allows you to organize products by expiration date to keep track of them.
base: core24
confinement: strict
grade: stable
license: GPL-3.0-or-later
compression: lzo

platforms: 
  amd64:
  arm64:
  armhf:

apps:
  icon-browser-adw:
    command: bin/caducity
    desktop: share/applications/io.github.rsvzz.caducity-sys.desktop
    extensions: [gnome]
    common-id: io.github.rsvzz.caducity-sys
    slots: [caducity-sys-dbus]
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland

parts:

   caducity-sys:
    plugin: meson
    source: . #https://github.com/rsvzz/caducity-sys/releases/download/${CRAFT_PROJECT_VERSION}/caducity-sys_all.tar.xz
    meson-parameters:
      - --prefix=/
      - --buildtype=release
      - --native-file=${CRAFT_PART_SRC}/data/build-aux/native.ini
    build-environment:
      - C_INCLUDE_PATH: ${SNAPCRAFT_STAGE}/include
      - LIBRARY_PATH: ${SNAPCRAFT_STAGE}/lib/x86_64-linux-gnu
    build-packages:
      - meson
      - rustc-1.91
      - cargo-1.91
      - libsqlite3-dev
    override-pull: | 
      snapcraftctl pull 
      cp -rv ${CRAFT_PART_SRC}/vendor ${CRAFT_PART_BUILD}/vendor
      cp -r ${CRAFT_PART_SRC}/.cargo/config.toml ${CRAFT_PART_BUILD}/.cargo
    override-build: |
      snapcraftctl build
      rm -r ${CRAFT_PART_INSTALL}/share/applications/io.github.rsvzz.caducity-sys.desktop
      cp -v ${CRAFT_PART_SRC}/data/desktop/io.github.rsvzz.caducity-sys-snap.desktop ${CRAFT_PART_INSTALL}/share/applications/io.github.rsvzz.caducity-sys.desktop

slots:
  caducity-sys-dbus:
    interface: dbus
    bus: session
    name: io.github.rsvzz.caducity-sys